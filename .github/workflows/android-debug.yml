name: Android Debug APK (for device testing)

# Produces a debug APK you can sideload straight onto a phone.
#
# Why this exists alongside android-release.yml: a release build needs a keystore,
# and creating one needs `keytool` from a local JDK. This workflow needs NO
# keystore and NO secrets, so it is the fastest route from zero tooling to an app
# on a real device. Debug APKs are signed automatically with Android's standard
# debug key.
#
# Not for distribution — Play will not accept a debug APK, and it cannot be
# installed over a release build of the same app (conflicting signatures).
#
# GOOGLE_SERVICES_JSON is optional here, unlike in the release workflow. Without
# it the app still builds and runs, but Firebase-backed features are inert:
#   - phone OTP sign-in will not work
#   - push notifications will not arrive
# Everything else (the site, Razorpay, offline mode, back button, safe areas,
# deep links) works fine.

on:
  workflow_dispatch:
    inputs:
      serverUrl:
        description: 'Which deployment the app loads'
        required: true
        default: 'https://preview.askchetna.com'
        type: choice
        options:
          - 'https://preview.askchetna.com'
          - 'https://www.askchetna.com'
      debugWebview:
        description: 'Enable remote WebView inspection (chrome://inspect)'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            BYTES=$(wc -c < mobile/android/app/google-services.json)
            echo "google-services.json written ($BYTES bytes)"

            # Fail early on a truncated or wrong-shaped paste rather than letting
            # it surface later as an unexplained runtime failure.
            if ! grep -q '"project_id"' mobile/android/app/google-services.json; then
              echo "::error::google-services.json has no project_id — the secret looks truncated or is not the right file."
              exit 1
            fi
            PROJECT=$(grep -o '"project_id"[^,]*' mobile/android/app/google-services.json | head -1)
            echo "  $PROJECT"
            echo "FIREBASE_CONFIG=present" >> "$GITHUB_ENV"

            # Report which OAuth clients the file carries.
            #
            # Firebase adds an ANDROID oauth_client (client_type 1, carrying a
            # certificate_hash) only once a SHA-1 is registered — and only into
            # copies of google-services.json downloaded AFTER that. A file
            # downloaded beforehand keeps working for most things but lacks the
            # entry native Google Sign-In matches against, which is a genuinely
            # easy way to be stuck with a stale config and no clue why.
            ANDROID_CLIENTS=$(grep -c '"client_type": *1' mobile/android/app/google-services.json || true)
            WEB_CLIENTS=$(grep -c '"client_type": *3' mobile/android/app/google-services.json || true)
            echo "  oauth_client entries: android=$ANDROID_CLIENTS web=$WEB_CLIENTS"
            echo "GS_ANDROID_CLIENTS=$ANDROID_CLIENTS" >> "$GITHUB_ENV"
            echo "GS_WEB_CLIENTS=$WEB_CLIENTS" >> "$GITHUB_ENV"

            if [ "$ANDROID_CLIENTS" = "0" ]; then
              echo "::warning::google-services.json contains no Android oauth_client. If it was downloaded before the SHA-1 was registered in Firebase, re-download it and update the GOOGLE_SERVICES_JSON secret."
            fi
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — phone OTP and Google sign-in will NOT work in this APK."
            echo "FIREBASE_CONFIG=missing" >> "$GITHUB_ENV"
          fi

      - name: Prepare a STABLE debug keystore
        # Android generates a debug keystore with a RANDOM key on first use, and CI
        # runners are ephemeral — so without this every build had a different
        # debug SHA-1. A fingerprint registered in Firebase then matched only the
        # single build it came from, and every later APK failed phone OTP and
        # Google sign-in with DEVELOPER_ERROR.
        #
        # With ANDROID_DEBUG_KEYSTORE_BASE64 set, all builds share one certificate
        # and the fingerprint needs registering just once. Without it, one is
        # generated here and its base64 printed to the run summary, so it can be
        # saved as that secret and reused from then on.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -uo pipefail
          KS="$RUNNER_TEMP/debug.keystore"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "Using the pinned debug keystore from ANDROID_DEBUG_KEYSTORE_BASE64."
            echo "DEBUG_KEYSTORE_PINNED=yes" >> "$GITHUB_ENV"
          else
            # Standard Android debug conventions, so it behaves exactly like the
            # keystore AGP would have made. These are not secrets.
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "C=US, O=Android, CN=Android Debug" >/dev/null 2>&1
            echo "::warning::No pinned debug keystore. Generated a throwaway one — its SHA-1 will change on the next run. See the run summary to make it permanent."
            echo "DEBUG_KEYSTORE_PINNED=no" >> "$GITHUB_ENV"
            echo "GENERATED_KEYSTORE_B64=$(base64 -w0 "$KS")" >> "$GITHUB_ENV"
          fi

          echo "ASKCHETNA_DEBUG_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Capacitor sync
        # Regenerates capacitor.config.json and copies mobile/shell/ into the
        # native project; both are gitignored, so this is not optional.
        #
        # `npm run cap:sync` (not `cap sync` directly) so prepare-shell.mjs also
        # points the offline page's retry at the same deployment.
        env:
          # Gates webContentsDebuggingEnabled in capacitor.config.ts. Off by
          # default in release builds so nobody holding the device can inspect a
          # signed-in session.
          CAP_DEBUG_WEBVIEW: ${{ inputs.debugWebview && '1' || '0' }}
          CAP_SERVER_URL: ${{ inputs.serverUrl }}
        run: |
          npm run cap:sync
          echo "--- synced native config ---"
          cat mobile/android/app/src/main/assets/capacitor.config.json

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          chmod +x ./gradlew

          # Confirm the config survived `cap sync`, which runs between writing it
          # and building.
          if [ -f app/google-services.json ]; then
            echo "google-services.json present at build time ($(wc -c < app/google-services.json) bytes)"
          else
            echo "::warning::app/google-services.json is NOT present at build time."
          fi

          # Output is teed so the summary can check whether the google-services
          # plugin actually ran. `apply plugin` in app/build.gradle sits inside a
          # try/catch that swallows failures, so a plugin that never applied looks
          # identical to a successful build.
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

          echo "::group::Google Services plugin tasks"
          grep -iE "Task :app:process.*GoogleServices|google-services" "$RUNNER_TEMP/gradle.log" || \
            echo "No google-services task ran — the plugin did not apply."
          echo "::endgroup::"

          echo "::group::Generated resource tree"
          find app/build/generated -maxdepth 4 -type d 2>/dev/null | head -25 || true
          echo "::endgroup::"

          if grep -qiE "Task :app:process.*GoogleServices" "$RUNNER_TEMP/gradle.log"; then
            echo "GOOGLE_SERVICES_TASK=ran" >> "$GITHUB_ENV"
          else
            echo "GOOGLE_SERVICES_TASK=absent" >> "$GITHUB_ENV"
          fi

      - name: Print debug signing fingerprints
        # Firebase needs the debug key's SHA-1 registered or Android phone auth
        # rejects every verification request, and assetlinks.json needs the
        # SHA-256. Surfaced here so both can be copied without a local JDK — see
        # mobile/FIREBASE-SETUP.md.
        #
        # MUST run AFTER the build: Gradle generates the debug keystore on the
        # first debug build, so running this earlier reported the store path with
        # no fingerprints at all.
        #
        # Uses keytool rather than `gradlew signingReport`, whose output repeats
        # once per variant and buries the values in ~90 lines of noise.
        run: |
          set -uo pipefail

          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk

          echo "::group::Debug signing fingerprints"

          # Read the certificate out of the APK rather than hunting for the
          # keystore file, whose location varies with ANDROID_SDK_HOME /
          # GRADLE_USER_HOME on the runner. This also reports the certificate that
          # actually signed THIS artifact, which is what Firebase must match.
          #
          # apksigner, NOT `keytool -printcert -jarfile`: keytool only understands
          # the v1 (JAR) signature, and with minSdk 24 the build signs using APK
          # Signature Scheme v2/v3 and can omit v1 entirely — which is why the
          # previous version printed an empty fingerprint and fell back.
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"

          # apksigner prints digests as unseparated lowercase hex, but Firebase's
          # "Add fingerprint" field expects colon-separated uppercase — so reformat
          # rather than hand over something that cannot be pasted.
          colonise() { tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//'; }

          SHA1=""; SHA256=""
          if [ -n "$APKSIGNER" ]; then
            CERTS="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null || true)"
            SHA1=$(echo "$CERTS" | grep -i "SHA-1 digest" | head -1 | grep -oE "[0-9a-f]{40}" | colonise)
            SHA256=$(echo "$CERTS" | grep -i "SHA-256 digest" | head -1 | grep -oE "[0-9a-f]{64}" | colonise)
          fi

          # Fall back to keytool, which only understands a v1-signed APK.
          if [ -z "$SHA1" ]; then
            KT="$(keytool -printcert -jarfile "$APK" 2>/dev/null || true)"
            SHA1=$(echo "$KT" | grep -E "^[[:space:]]*SHA1:" | head -1 | sed 's/.*SHA1:[[:space:]]*//')
            SHA256=$(echo "$KT" | grep -E "^[[:space:]]*SHA-?256:" | head -1 | sed 's/.*SHA-\?256:[[:space:]]*//')
          fi

          # Shared with the summary step so it doesn't repeat the work.
          {
            echo "APK_SHA1=$SHA1"
            echo "APK_SHA256=$SHA256"
          } >> "$GITHUB_ENV"

          if [ -n "$SHA1" ]; then
            echo "Read from: $APK"
            echo "  apksigner: ${APKSIGNER:-<not found>}"
            echo ""
            echo "SHA1:   $SHA1"
            echo "SHA256: $SHA256"
            echo ""
            echo "SHA1   -> Firebase: Project settings > Your apps > Add fingerprint"
            echo "          (required for phone OTP and native Google sign-in on Android)"
            echo "SHA256 -> public/.well-known/assetlinks.json"
          else
            # Never fail silently: an empty block is the exact bug this step has
            # already had twice.
            echo "::error::Could not read the signing certificate from the APK. Android phone OTP and Google sign-in will not work until the SHA-1 is registered in Firebase."
            echo "apksigner: ${APKSIGNER:-<not found>}"
            ls -la "$APK" 2>/dev/null || echo "APK missing at $APK"
          fi

          echo "::endgroup::"

      - name: Report APK details
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Build produced no APK at $APK"
            exit 1
          fi
          echo "APK size: $(du -h "$APK" | cut -f1)"

          # Confirms the server URL actually made it into the bundle, which is the
          # single most important thing about this build.
          echo "--- capacitor.config.json inside the APK ---"
          unzip -p "$APK" assets/capacitor.config.json | head -20

          # Fail rather than hand over an APK pointing at the wrong deployment.
          EXPECTED='${{ inputs.serverUrl }}'
          if ! unzip -p "$APK" assets/capacitor.config.json | grep -q "\"url\": *\"$EXPECTED\""; then
            echo "::error::APK server.url does not match the requested $EXPECTED"
            exit 1
          fi
          echo "Verified server.url = $EXPECTED"

          echo "--- offline.html retry target ---"
          unzip -p "$APK" assets/public/offline.html | grep "var SITE" || true

      - name: Build summary
        # Written to the run summary rather than only the log. The previous
        # version emitted a ::warning:: about missing Firebase config that was
        # easy to scroll past, and the resulting APK then failed phone OTP and
        # Google sign-in with no obvious reason why.
        if: always()
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk

          {
            echo "## AskChetna debug APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Loads | \`${{ inputs.serverUrl }}\` |"
            echo "| WebView inspection | ${{ inputs.debugWebview && 'enabled (chrome://inspect)' || 'disabled' }} |"

            if [ "${FIREBASE_CONFIG:-missing}" = "present" ]; then
              echo "| Firebase config | present |"
            else
              echo "| Firebase config | **MISSING** |"
            fi
            echo ""

            # Proof the google-services plugin actually ran. Searched by CONTENT
            # rather than by path: an earlier version looked for a values.xml under
            # a directory literally named "google-services" and reported "not
            # generated" even when the secret was correctly set, because the plugin
            # writes to a different path depending on AGP version.
            #
            # Two independent signals, since `apply plugin` sits inside a
            # try/catch in app/build.gradle that hides a plugin which never applied.
            GENERATED=$(grep -rl "google_app_id" mobile/android/app/build/generated 2>/dev/null | head -1)
            if [ -n "$GENERATED" ] || [ "${GOOGLE_SERVICES_TASK:-absent}" = "ran" ]; then
              echo "Firebase resources were generated, so the app can reach Firebase."
              echo ""
              echo "Phone OTP and Google sign-in additionally need the **SHA-1 below** registered in"
              echo "Firebase (Project settings → Your apps → Add fingerprint). Without it Android"
              echo "returns error 10 / DEVELOPER_ERROR and phone verification never calls back."
            else
              echo "> **Firebase does not appear to be wired into this build.**"
              echo ">"
              if [ "${FIREBASE_CONFIG:-missing}" = "missing" ]; then
                echo "> The \`GOOGLE_SERVICES_JSON\` repository secret is not set. Add it with the"
                echo "> full contents of \`google-services.json\` from the Firebase console."
                echo ">"
                echo "> It is a **GitHub Actions secret**, distinct from"
                echo "> \`FIREBASE_SERVICE_ACCOUNT_BASE64\`, which is a **Vercel** variable used by"
                echo "> the server. Both are needed, for opposite halves of the flow."
              else
                echo "> The secret IS set and the file was written, but the google-services Gradle"
                echo "> plugin produced no resources. See the *Google Services plugin tasks* and"
                echo "> *Generated resource tree* groups in the build log."
                echo ">"
                echo "> \`apply plugin: 'com.google.gms.google-services'\` in"
                echo "> \`mobile/android/app/build.gradle\` sits inside a try/catch that swallows"
                echo "> failures, so a plugin that never applied looks like a clean build."
              fi
            fi

            echo ""
            echo "### Debug signing certificate"
            echo ""
            # Computed by the fingerprint step and passed through GITHUB_ENV.
            if [ -n "${APK_SHA1:-}" ]; then
              echo "\`\`\`"
              echo "SHA1:   ${APK_SHA1}"
              echo "SHA256: ${APK_SHA256:-}"
              echo "\`\`\`"
            else
              echo "> Could not read the signing certificate from the APK — see the"
              echo "> *Print debug signing fingerprints* step."
            fi
            echo ""

            if [ "${DEBUG_KEYSTORE_PINNED:-no}" = "yes" ]; then
              echo "This fingerprint is **stable** across builds — it will not change on the next"
              echo "run. Register it in Firebase once."
              echo ""
              if [ "${GS_ANDROID_CLIENTS:-0}" = "0" ]; then
                echo "> \`google-services.json\` carries **no Android oauth_client**."
                echo ">"
                echo "> Firebase only adds that entry once a SHA-1 is registered, and only to"
                echo "> copies downloaded afterwards. If you registered the fingerprint after"
                echo "> downloading the file, re-download it from the Firebase console and update"
                echo "> the \`GOOGLE_SERVICES_JSON\` secret — native Google Sign-In matches against"
                echo "> that entry."
              else
                echo "\`google-services.json\` carries an Android oauth_client, so it is up to date"
                echo "with the registered fingerprint(s)."
              fi
            else
              echo "> **This fingerprint will CHANGE on the next run.**"
              echo ">"
              echo "> Android generates the debug keystore with a random key, and CI runners are"
              echo "> ephemeral — so registering this SHA-1 in Firebase would only ever match this"
              echo "> one build. That is why phone OTP and Google sign-in fail with"
              echo "> DEVELOPER_ERROR even after adding a fingerprint."
              echo ">"
              echo "> **Fix it once:** copy the value below into a repository secret named"
              echo "> \`ANDROID_DEBUG_KEYSTORE_BASE64\`, then re-run. Every future build will share"
              echo "> one certificate, and the SHA-1 above becomes permanent."
              echo ""
              echo "<details><summary>ANDROID_DEBUG_KEYSTORE_BASE64</summary>"
              echo ""
              echo '```'
              echo "${GENERATED_KEYSTORE_B64:-}"
              echo '```'
              echo ""
              echo "</details>"
            fi

            echo ""
            if [ -f "$APK" ]; then
              echo "APK size: $(du -h "$APK" | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: askchetna-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
