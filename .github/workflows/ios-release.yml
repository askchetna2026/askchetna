name: iOS Release (TestFlight)

# Builds a signed IPA on a macOS runner and uploads it to TestFlight.
#
# This workflow is what removes the need for a Mac: Xcode only exists on macOS,
# so an IPA cannot be produced on Windows or Linux at all.
#
# Required repository secrets:
#   IOS_CERTIFICATE_P12_BASE64    Apple Distribution certificate as .p12, base64
#   IOS_CERTIFICATE_PASSWORD      password used when exporting that .p12
#   IOS_PROVISIONING_PROFILE_BASE64  App Store provisioning profile (.mobileprovision), base64
#   APPSTORE_ISSUER_ID            App Store Connect API key issuer id (a UUID)
#   APPSTORE_KEY_ID               App Store Connect API key id
#   APPSTORE_PRIVATE_KEY          contents of the AuthKey_XXXX.p8
#   APPLE_TEAM_ID                 10-character Team ID
#   GOOGLE_SERVICE_INFO_PLIST     contents of GoogleService-Info.plist (FCM/phone auth)
#
# Produce the base64 values with:  base64 -i file -o -

on:
  workflow_dispatch:
    inputs:
      buildNumber:
        description: 'CFBundleVersion. Must be unique per upload; defaults to the run number.'
        required: false
        type: string
  push:
    tags:
      - 'ios-v*'

jobs:
  build:
    # Pinned rather than macos-latest: Xcode version drives Swift and the
    # minimum SDK, and a silent runner bump is a confusing way to start failing.
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write GoogleService-Info.plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$PLIST" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST is not set. Phone OTP and push would both fail at runtime."
            exit 1
          fi
          printf '%s' "$PLIST" > mobile/ios/App/App/GoogleService-Info.plist
          plutil -lint mobile/ios/App/App/GoogleService-Info.plist

      - name: Capacitor sync
        # Also runs pod install, which is why this cannot happen on Windows.
        run: npx cap sync ios

      - name: Set build number
        # CFBundleVersion must be unique for every TestFlight upload; reusing one
        # is rejected after the upload completes.
        run: |
          BUILD_NUMBER="${{ inputs.buildNumber }}"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="${{ github.run_number }}"; fi
          cd mobile/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
          echo "Build number set to $BUILD_NUMBER"

      - name: Import signing certificate and profile
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$CERT_BASE64" | base64 -d > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"

          # A dedicated throwaway keychain, so nothing touches the runner default.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"

          # Lets xcodebuild use the key without an interactive prompt, which would
          # otherwise hang the runner until it times out.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build archive
        working-directory: mobile/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates

          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # altool looks for the key in this exact location and filename.
          mkdir -p ~/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8

          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -1)"
          if [ -z "$IPA" ]; then
            echo "::error::No IPA was produced by the export step."
            exit 1
          fi

          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

          echo "Uploaded. TestFlight processing usually takes 5-15 minutes."

      - name: Upload IPA as an artifact
        # Kept even on failure so a signing problem can be inspected locally.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: askchetna-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
