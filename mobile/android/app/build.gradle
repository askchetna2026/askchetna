apply plugin: 'com.android.application'

android {
    namespace = "com.askchetnam.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.askchetnam.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * Release signing, driven entirely by environment variables so no keystore or
     * password is ever committed.
     *
     * The whole block is conditional: when ASKCHETNA_KEYSTORE_PATH is absent
     * (any local machine), no release signingConfig is registered and debug
     * builds carry on as normal. CI sets all four before calling bundleRelease.
     */
    signingConfigs {
        /**
         * Pin the DEBUG signing key when one is supplied.
         *
         * Android generates a debug keystore on first use, with a RANDOM key. CI
         * runners are ephemeral, so every build produced a different debug
         * certificate and therefore a different SHA-1 — which meant a fingerprint
         * registered in Firebase only ever matched the one build it came from, and
         * phone OTP / Google sign-in failed with DEVELOPER_ERROR on every
         * subsequent APK.
         *
         * Supplying a fixed keystore makes the fingerprint stable, so it needs
         * registering in Firebase exactly once.
         *
         * Debug keystore credentials are the well-known Android defaults, not
         * secrets: password `android`, alias `androiddebugkey`.
         */
        if (System.getenv('ASKCHETNA_DEBUG_KEYSTORE_PATH')) {
            debug {
                storeFile file(System.getenv('ASKCHETNA_DEBUG_KEYSTORE_PATH'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }

        if (System.getenv('ASKCHETNA_KEYSTORE_PATH')) {
            release {
                storeFile file(System.getenv('ASKCHETNA_KEYSTORE_PATH'))
                storePassword System.getenv('ASKCHETNA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ASKCHETNA_KEY_ALIAS')
                keyPassword System.getenv('ASKCHETNA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // Only attach if the config above was actually created, otherwise
            // Gradle fails resolving a signingConfig that does not exist.
            if (System.getenv('ASKCHETNA_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
