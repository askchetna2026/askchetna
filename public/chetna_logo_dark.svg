  <defs>
    <linearGradient id="acGoldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D87A"/>
      <stop offset="1" stop-color="#C49A2B"/>
    </linearGradient>
    <radialGradient id="acGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5D3FD3" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#5D3FD3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5D3FD3" stop-opacity="0"/>
    </radialGradient>
    <style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');</style>
  </defs>
  <circle cx="62" cy="60" r="78" fill="url(#acGlow)"/>
  <path d="M100.3,92.15 A50 50 0 1 1 100.3,27.85" fill="none" stroke="url(#acGoldDark)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="62" cy="110" r="2" fill="url(#acGoldDark)"/>
  <circle cx="26.64" cy="95.36" r="2" fill="url(#acGoldDark)"/>
  <circle cx="12" cy="60" r="2" fill="url(#acGoldDark)"/>
  <circle cx="26.64" cy="24.64" r="2" fill="url(#acGoldDark)"/>
  <circle cx="62" cy="10" r="2" fill="url(#acGoldDark)"/>
  <path d="M62,48 Q63.8,58.2 74,60 Q63.8,61.8 62,72 Q60.2,61.8 50,60 Q60.2,58.2 62,48 Z" fill="url(#acGoldDark)"/>
  <text x="132" y="72" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">
    <tspan fill="#DFE0FF">Ask</tspan><tspan fill="url(#acGoldDark)">Chetna</tspan></text>
  <text x="251" y="98" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="11.5" letter-spacing="3.5" fill="#B3B2B9">ASTROLOGY FOR AWARENESS</text>
